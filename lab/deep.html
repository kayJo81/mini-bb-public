<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 블벅 랩 · 심층 뉴스</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#e5e7eb;--sub:#6b7280;--ink:#111827;--grid:#eef0f3;--acc:#2563eb;--r:14px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);--mono:'JetBrains Mono',monospace;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
a{color:inherit}.wrap{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0;line-height:1.3}h1 b{color:var(--acc)}.hsub{font-size:12px;color:var(--sub)}
.link{font-size:12px;font-weight:600;text-decoration:none;background:#fff;color:#111827;border:.5px solid var(--bd);padding:7px 12px;border-radius:9px;white-space:nowrap}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px;min-width:0}
.item{display:block;text-decoration:none}.item h2{font-size:17px;margin:4px 0 4px;line-height:1.4}.item p{margin:0;font-size:13px;color:#374151}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;margin-right:4px}
.date{font-size:12px;color:var(--sub);font-family:var(--mono)}
/* 본문 */
.art h1{font-size:23px;margin:6px 0 6px}.art .lede{font-size:15px;color:#374151;margin:0 0 6px}
.art h2{font-size:18px;margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--grid)}
.art h3{font-size:15.5px;margin:18px 0 6px}
.art p{margin:8px 0}.art ul,.art ol{padding-left:20px;margin:6px 0}.art li{margin:4px 0}
.art b{font-weight:700}.art .num{font-family:var(--mono);font-weight:700}
.req{background:#f8fafc;border:1px solid var(--bd);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0 4px}
.req .k{font-size:11.5px;font-weight:700;color:var(--acc);letter-spacing:.02em}
.tldr{background:#111827;color:#f9fafb;border-radius:12px;padding:14px 16px;margin:14px 0}
.tldr .k{font-size:12px;font-weight:700;color:#93c5fd}.tldr ul{margin:6px 0 0}.tldr li{margin:5px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.kpi{border:.5px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff}.kpi .k{font-size:11.5px;color:var(--sub);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:700}.kpi .d{font-size:11.5px;color:var(--sub);line-height:1.4}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:6px 8px;border-bottom:.5px solid var(--grid);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px}td.r,th.r{text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl table.w5{min-width:540px}.tbl table.w7{min-width:760px}.tbl table.w7 td:first-child{min-width:6.5em}   /* 글이 긴 표는 모바일에서 옆으로 밀어 보기 */
/* 표: '항목·숫자·비교' 3칸 표는 비교를 '·' 단위로 끊어 줄마다, 휴대폰에선 표 대신 카드(항목—숫자 한 줄 + 비교 목록) */
table.cmp td.cm .c+.c:before{content:" · ";color:#9ca3af}
table.cmp td:first-child{font-weight:600;color:#111827}
@media (max-width:640px){
  .tbl{overflow-x:visible}.tbl table.w5,.tbl table.w7{min-width:0}
  table.cmp,table.cmp tbody,table.cards,table.cards tbody{display:block}
  table.cmp tr:first-child:has(th),table.cards tr:first-child:has(th){display:none}
  table.cmp tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;border-bottom:.5px solid var(--grid)}
  table.cmp td{border:0;padding:0}
  table.cmp td.r{font-size:14.5px;align-self:start}
  table.cmp td.cm{grid-column:1/-1;font-size:12.5px;color:#4b5563;line-height:1.5}
  table.cmp td.cm .c{display:block;padding-left:10px;position:relative}
  table.cmp td.cm .c:before,table.cmp td.cm .c+.c:before{content:"";position:absolute;left:1px;top:.62em;width:4px;height:4px;border-radius:50%;background:#cbd5e1}
  table.cards tr{display:block;padding:9px 2px;border-bottom:.5px solid var(--grid)}
  table.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:1px 0;text-align:right;white-space:normal}
  table.cards td:first-child{display:block;text-align:left;font-weight:700;font-family:inherit;margin-bottom:2px}
  table.cards td:not(:first-child):before{content:attr(data-l);color:var(--sub);font:600 12px Inter,'Apple SD Gothic Neo',sans-serif;text-align:left;flex:0 0 auto;max-width:45%}
}
.fig{margin:12px 0;border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;background:#fff}
.fig .t{font-size:13px;font-weight:700}.fig .s{font-size:11.5px;color:var(--sub)}
.fig svg{display:block;width:100%;height:auto}.fig svg .ax{font-size:10px}
.ax{font-size:11px;fill:var(--sub);font-family:var(--mono)}.lb{font-size:11.5px;fill:#111827;font-family:var(--mono);font-weight:700}
.note{font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;vertical-align:1px}
.badge.ok{background:#dcfce7;color:#166534}.badge.one{background:#fef3c7;color:#92400e}.badge.est{background:#f3f4f6;color:#374151}
.src{font-size:12.5px}.src li{word-break:break-all}
.callout{border:1px solid #fde68a;background:#fffbeb;border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>미니 블벅 <b>랩</b> · 심층 뉴스</h1><div class="hsub">요청하신 주제를 깊게 정리한 기사 모음</div></div><a class="link" id="back" href="./">← 랩 메인</a></header>
<div id="app"><div class="card note">불러오는 중…</div></div>
<p class="hsub">투자 권유 아님 · 각 기사 끝에 출처 · <span class="badge ok">복수 확인</span> 여러 매체가 같은 내용 보도 · <span class="badge one">단일 출처</span> 한 곳만 보도 · <span class="badge est">추정</span> 계산·해석<span id="visits"></span></p>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=(new URLSearchParams(location.search).get('id')||'').replace(/[^a-z0-9-]/g,'');
// 저장소(main)에서 바로 읽기 → 푸시 몇 분 뒤 반영 (실시간 갱신 기사용) · 실패하면 배포본
const RAW='https://raw.githubusercontent.com/kayJo81/mini-bb-public/main/lab/deepnews/';
const get=p=>fetch(RAW+p+'?t='+Math.floor(Date.now()/60000),{cache:'no-store'}).then(r=>r.ok?r:Promise.reject(r.status)).catch(()=>fetch('deepnews/'+p,{cache:'no-store'}));
const liveTag=a=>a.live?`<span class="tag" style="background:#fee2e2;color:#b91c1c">🔴 실시간 갱신 중${a.updated?' · '+esc(a.updated):''}</span>`:(a.updated?`<span class="tag" style="background:#f3f4f6;color:#374151">갱신 ${esc(a.updated)}</span>`:'');
get('index.json').then(r=>r.json()).then(L=>{
  L.sort((a,b)=>b.date.localeCompare(a.date));
  if(!id){
    document.getElementById('app').innerHTML=L.length?L.map(a=>`<a class="card item" href="deep?id=${esc(a.id)}"><span class="date">${esc(a.date)}</span> ${liveTag(a)} ${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
      <h2>${esc(a.title)}</h2><p>${esc(a.sub)}</p></a>`).join(''):'<div class="card note">아직 기사가 없어요</div>';
    return;}
  const a=L.find(x=>x.id===id);if(!a){document.getElementById('app').innerHTML='<div class="card note">기사를 찾지 못했어요</div>';return;}
  document.title=`미니 블벅 랩 · ${a.title}`;const bk=document.getElementById('back');bk.href='deep';bk.textContent='← 심층 뉴스 목록';
  // 기사 본문은 저장소에서 직접 쓴 HTML 조각 (외부 입력 아님)
  if(a.live)setTimeout(()=>location.reload(),120000);   // 실시간 갱신 기사는 2분마다 새로 읽기
  get(`${id}.html`).then(r=>r.text()).then(h=>{
    document.getElementById('app').innerHTML=`<article class="card art"><span class="date">${esc(a.date)}</span> ${liveTag(a)} ${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
      <h1>${esc(a.title)}</h1><p class="lede">${esc(a.sub)}</p>
      <div class="req"><div class="k">📝 요청 내용</div>${esc(a.request)}</div>${(a.tilts||[]).length?`<div class="req" style="border-left-color:#16a34a"><div class="k" style="color:#16a34a">🧭 포트폴리오 반영 (<a href="sim">가상 운용</a>)</div>${a.tilts.map(t=>`<div>${t.dir>0?'비중↑':'비중↓·숏'} <b>${t.syms.map(esc).join(', ')}</b> · ~${esc(t.until||'')} — ${esc(t.why||'')}</div>`).join('')}</div>`:''}${h}</article>`;
    tidyTables(document.querySelector('.art'));});
}).catch(e=>{document.getElementById('app').innerHTML=`<div class="card note">불러오지 못했어요 (${esc(e.message)})</div>`;});
// 표 손질: 머리 줄 이름을 칸마다 붙이고(휴대폰 카드용), '항목·숫자·비교' 3칸 표는 비교 칸을 ' · ' 단위(괄호 밖)로 끊음
function splitDots(html){
  const out=[];let d=0,cur='';
  for(let i=0;i<html.length;i++){const ch=html[i];
    if(ch==='('||ch==='（')d++;else if((ch===')'||ch==='）')&&d)d--;
    if(!d&&html.startsWith(' · ',i)){out.push(cur);cur='';i+=2;continue;}
    cur+=ch;}
  out.push(cur);return out.map(x=>x.trim()).filter(Boolean);
}
function tidyTables(root){
  if(!root)return;
  root.querySelectorAll('table').forEach(t=>{
    const rows=[...t.rows];if(!rows.length)return;
    const head=rows[0].querySelector('th')?[...rows[0].cells].map(c=>c.textContent.trim()):null;
    const n=Math.max(...rows.map(r=>r.cells.length));
    if(head)rows.slice(1).forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=head[i]||''));
    if(n===3&&head&&!rows[0].cells[2].classList.contains('r')){
      t.classList.add('cmp');
      rows.slice(1).forEach(r=>{const c=r.cells[2];if(!c)return;c.classList.add('cm');
        const parts=splitDots(c.innerHTML);
        // 숫자로 시작하는 조각이 있으면(예: '연말 6.43억 · 3.72억' — 두 값을 짝지은 것) 끊지 않음
        if(parts.length>1&&!parts.some(x=>/^[\d+\-−$.%]/.test(x.replace(/<[^>]+>/g,''))))c.innerHTML=parts.map(x=>`<span class="c">${x}</span>`).join('');});
    }else if(head&&n>=3)t.classList.add('cards');
  });
}
// 방문자 수: 미국 증시 터미널과 같은 집계(api/visit)에 합산 — 브라우저당 하루 1번 (실시간 기사 2분 새로고침은 안 셈)
(async()=>{
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  let seen=null;try{seen=localStorage.getItem('mbb_visit');}catch(e){}
  try{
    const v=await (await fetch('https://mini-bbterminal.pages.dev/api/visit',{method:seen===today?'GET':'POST',cache:'no-store'})).json();
    if(seen!==today){try{localStorage.setItem('mbb_visit',today);}catch(e){}}
    if(v.today!=null)document.getElementById('visits').textContent=` · 방문 오늘 ${v.today.toLocaleString()} · 누적 ${v.total.toLocaleString()}`;
  }catch(e){}
})();
</script>
</body>
</html>
