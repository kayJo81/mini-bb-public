<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 블벅 랩 · 아침 프리필</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#e5e7eb;--sub:#6b7280;--ink:#111827;--acc:#2563eb;--r:14px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
a{color:inherit}.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 b{color:var(--acc)}.hsub{font-size:12px;color:var(--sub)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.link{font-size:12px;font-weight:600;text-decoration:none;background:#fff;color:#111827;border:.5px solid var(--bd);padding:7px 12px;border-radius:9px;white-space:nowrap;cursor:pointer;font-family:inherit}
.link.dark{background:#111827;color:#fff;border-color:#111827}
select.link{padding:6px 8px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;min-width:0}
.sec{font-size:17px;font-weight:700;color:var(--acc);margin:22px 2px 8px;letter-spacing:-.2px}
h3{font-size:14.5px;margin:0 0 4px}
.sub{font-size:12px;color:#374151;margin:0 0 6px;background:#f9fafb;border-radius:8px;padding:6px 9px}
.note{font-size:11.5px;color:var(--sub);margin:6px 0 0}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #f0f1f3;vertical-align:top}
th{font-weight:600;color:var(--sub);font-size:11.5px;white-space:nowrap;background:#fafafa}
td.n{font-family:var(--mono);white-space:nowrap;font-size:12px}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:4px 0 0 #fff}
th:first-child{background:#fafafa;box-shadow:4px 0 0 #fafafa}
td.b{font-weight:700}.up{color:#c0392b}.dn{color:#1f62b5}
.kv td:first-child{width:120px;color:var(--sub);font-weight:600;white-space:nowrap}
.news{list-style:none;margin:4px 0 0;padding:0}
.news li{padding:7px 0;border-bottom:1px solid #f0f1f3}.news li:last-child{border:0}
.news .h{font-weight:600}.news .m{font-size:12px;color:var(--sub)}
.sum{margin:0;padding-left:18px}.sum li{margin:3px 0}
.chk .it{padding:8px 0;border-bottom:1px solid #f0f1f3}.chk .it:last-child{border:0}
.chk .q{font-weight:700;font-size:13px;margin-bottom:4px}
.chk label{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:13px;cursor:pointer}
.meta td:first-child{width:70px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
@media(max-width:600px){td,th{padding:5px 6px}td:first-child{min-width:92px;max-width:130px;white-space:normal}.kv td:first-child{width:auto;min-width:70px}}
@media print{body{background:#fff;font-size:11px}.wrap{max-width:none;padding:0}.bar,.noprint{display:none!important}
  .card{box-shadow:none;border:0;padding:4px 0;margin:0 0 6px;break-inside:avoid}.sec{break-before:auto;margin-top:12px}
  td:first-child,th:first-child{position:static}.tbl{overflow:visible}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>미니 블벅 <b>랩</b> · 아침 프리필</h1><div class="hsub" id="hsub">매일 07:00 KST 자동 작성 — 숫자·신호·조건은 채우고, 확률·행동은 회의에서</div></div>
  <div class="bar">
    <select class="link" id="day" aria-label="날짜"></select>
    <a class="link dark" id="docx" href="prefill.docx" download>📄 Word 받기</a>
    <button class="link" onclick="print()">🖨️ 인쇄</button>
    <a class="link" href="risk">📊 위험 대시보드</a>
    <a class="link" href="./">← 랩 메인</a>
  </div>
</header>
<div id="app"><div class="card">불러오는 중…</div></div>
<p class="hsub">투자 권유 아님 · 원자료: FRED(세인트루이스 연은)·CFTC·Deribit·CBOE·야후 파이낸스·미니 블벅 터미널 뉴스 · 신호 기준은 각 표 아래 · 회의 판단 체크는 이 기기에만 저장돼요</p>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const NUMRE=/^[\s$+\-−–~0-9.,%σbpTB()\/]+$/;

function td(c){
  const o=typeof c==='object'&&c?c:{t:c};const t=String(o.t??'');
  const cls=[NUMRE.test(t)&&/[0-9]/.test(t)?'n':'',o.b?'b':'',o.c==='up'?'up':o.c==='dn'?'dn':''].filter(Boolean).join(' ');
  return `<td${cls?` class="${cls}"`:''}>${esc(t)}</td>`;
}
function block(b,day){
  let h=`<div class="card">${b.title?`<h3>${esc(b.title)}</h3>`:''}${b.sub?`<p class="sub">${esc(b.sub)}</p>`:''}`;
  if(b.type==='table')h+=`<div class="tbl"><table><thead><tr>${b.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(td).join('')}</tr>`).join('')}</tbody></table></div>`;
  else if(b.type==='kv')h+=`<div class="tbl"><table class="kv"><tbody>${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
  else if(b.type==='news')h+=`<ul class="news">${b.items.map(it=>{const u=safeUrl(it.u);return `<li><div class="h">${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(it.h)}</a>`:esc(it.h)}</div>${it.m?`<div class="m">${esc(it.m)}</div>`:''}</li>`}).join('')}</ul>`;
  else if(b.type==='para')h+=`<p style="margin:0">${esc(b.text)}</p>`;
  else if(b.type==='check')h+=`<div class="chk">${b.items.map(([q,opts],i)=>`<div class="it"><div class="q">${esc(q)}</div>${opts.map((o,j)=>{const k=`pf:${day}:${i}:${j}`;
      return /_{3,}/.test(o)?`<label>${esc(o.replace(/_+/g,''))}<input class="ck" data-k="${k}" type="text" style="width:${/10/.test(o)?'48px':'180px'};font:inherit;border:0;border-bottom:1px solid #9ca3af;padding:0 2px" value="${esc(store.get(k))}"></label>`
      :`<label><input class="ck" data-k="${k}" type="checkbox" ${store.get(k)==='1'?'checked':''}>${esc(o)}</label>`}).join('')}</div>`).join('')}</div>`;
  if(b.note)h+=`<p class="note">${esc(b.note)}</p>`;
  return h+'</div>';
}
function render(d){
  const latest=$('day').options[0]?.value;
  $('docx').style.display=d.date===latest?'':'none';
  let h=`<div class="card"><div class="tbl"><table class="kv meta"><tbody>${d.meta.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(d.summary?.length)h+=`<div class="card"><h3>한눈에 <span class="pill">자동</span></h3><ul class="sum">${d.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
  for(const s of d.sections){h+=`<div class="sec">${esc(s.title)}</div>`;for(const b of s.blocks)h+=block(b,d.date);}
  $('app').innerHTML=h;
  $('hsub').textContent=`${d.date.replaceAll('-','.')} (${d.weekday}) · ${d.generated_at.slice(11,16)} KST 자동 작성 — 숫자·신호·조건은 채우고, 확률·행동은 회의에서`;
  document.querySelectorAll('.ck').forEach(el=>el.addEventListener(el.type==='checkbox'?'change':'input',()=>store.set(el.dataset.k,el.type==='checkbox'?(el.checked?'1':''):el.value)));
}
function load(day){
  const url=day?`prefill/${day}.json`:'prefill.json';
  fetch(url+'?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render)
    .catch(()=>{$('app').innerHTML='<div class="card">아직 프리필이 없어요. 다음 아침 실행(07:00 KST) 뒤에 생겨요.</div>';});
}
fetch('prefill/index.json?t='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(days=>{
  $('day').innerHTML=days.map(d=>`<option value="${esc(d)}">${esc(d.slice(5).replace('-','/'))}${d===days[0]?' (최신)':''}</option>`).join('')||'<option>최신</option>';
  const q=new URLSearchParams(location.search).get('d');
  if(q&&days.includes(q))$('day').value=q;
  $('day').onchange=()=>{const v=$('day').value;history.replaceState(null,'',v===days[0]?'prefill':`prefill?d=${v}`);load(v===days[0]?null:v);};
  load(q&&days.includes(q)&&q!==days[0]?q:null);
});
</script>
</body>
</html>
