<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 블벅 랩 · 시장 환경</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#e5e7eb;--sub:#6b7280;--ink:#111827;--acc:#2563eb;--up:#dc2626;--dn:#2563eb;--r:14px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}h1 b{color:var(--acc)}
.hsub{font-size:12px;color:var(--sub)}
.link{font-size:12px;font-weight:600;text-decoration:none;background:#111827;color:#fff;padding:7px 12px;border-radius:9px;white-space:nowrap}
.link.w{background:#fff;color:#111827;border:.5px solid var(--bd)}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;min-width:0}
h2{font-size:15px;margin:0 0 4px}
.note{font-size:12px;color:var(--sub);margin:0 0 10px}
.warn{background:#fffbeb;border-color:#fde68a}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.tile{border:.5px solid var(--bd);border-radius:12px;padding:9px 11px;min-width:0}
.tile .k{font-size:12px;color:var(--sub);font-weight:600}
.tile .v{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:2px}
.tile .d{font-size:11.5px;color:var(--sub)}
.tile svg{display:block;width:100%;height:26px;margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.tag.hot{background:#fee2e2;color:#991b1b}.tag.calm{background:#dcfce7;color:#166534}.tag.mid{background:#f3f4f6;color:#374151}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-weight:600;color:var(--sub);padding:5px 6px;border-bottom:.5px solid var(--bd);white-space:nowrap;cursor:pointer}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
td{padding:5px 6px;border-bottom:.5px solid #f1f2f4;text-align:right;font-family:var(--mono);white-space:nowrap}
td:first-child{font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}
.pm{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:.5px solid #f1f2f4;font-size:13px}
.pm .p{font-family:var(--mono);font-weight:700}
.pm .e{grid-column:1/-1;font-size:11.5px;color:var(--sub)}
.bar{height:5px;border-radius:3px;background:#e5e7eb;overflow:hidden;grid-column:1/-1}.bar i{display:block;height:100%;background:var(--acc)}
.empty{color:var(--sub);text-align:center;padding:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>미니 블벅 <b>랩</b> · 시장 환경</h1><div class="hsub" id="sub">불러오는 중…</div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><a class="link w" href="./">← 랩 메인</a><a class="link" href="https://mini-bbterminal.pages.dev">📰 미니 블벅터 →</a></div>
</header>
<div id="app"><div class="card empty">불러오는 중…</div></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(v,d=2)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function spark(vals){
  const v=vals.filter(x=>x!=null);if(v.length<2)return '';
  const mn=Math.min(...v),mx=Math.max(...v),w=100,h=26,n=vals.length;
  const pts=vals.map((x,i)=>x==null?null:`${(i/(n-1)*w).toFixed(1)},${(h-2-(x-mn)/((mx-mn)||1)*(h-4)).toFixed(1)}`).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
// 국면 판정 (참고용 표시 — 검증 전 기준)
const REG={
  vix:v=>v>=25?['hot','공포']:v<=15?['calm','안정']:['mid','보통'],
  vix_term:v=>v>=1?['hot','백워데이션']:v<=0.9?['calm','콘탱고']:['mid','평평'],
  pc_equity:v=>v>=0.8?['hot','풋 쏠림']:v<=0.5?['hot','콜 과열']:['mid','중립'],
  curve_10y3m:v=>v<0?['hot','역전']:['calm','정상'],
  spx_gex:v=>v<0?['hot','음(변동 확대)']:['calm','양(변동 억제)'],
};
const TILES=[['vix','VIX',2],['vix_term','VIX/VIX3M',3],['vvix','VVIX',1],['move','MOVE (채권 변동성)',1],['skew_idx','CBOE SKEW',1],
  ['pc_total','풋/콜 전체',2],['pc_equity','풋/콜 주식',2],['pc_index','풋/콜 지수',2],
  ['spx_gex','SPX 감마(백만$/1%)',0],['spx_skew25','SPX 25Δ 스큐',2],['spx_atm_iv30','SPX ATM IV 30일',2],
  ['spx_call_wall','SPX 콜월',0],['spx_put_wall','SPX 풋월',0],
  ['ust10y','미 10년물',3],['curve_10y3m','10년−3개월',3],['dxy','달러지수',2],['wti','WTI',2],['gold','금',1],['btc','비트코인',0],
  ['spy_short_ratio','SPY 공매도 비중',3],['qqq_short_ratio','QQQ 공매도 비중',3]];
let SORT={k:'gex_musd',d:-1};
function optTable(L){
  const o=L.options||{},sh=(L.short||{}).symbols||{};
  const rows=Object.entries(o).map(([s,x])=>({s,...x,short:(sh[s]||{}).short_ratio}));
  rows.sort((a,b)=>SORT.k==='s'?a.s.localeCompare(b.s)*SORT.d:((a[SORT.k]??-1e18)-(b[SORT.k]??-1e18))*SORT.d);
  const C=[['s','종목'],['price','가격'],['iv30','IV30'],['atm_iv30','ATM IV'],['skew25','25Δ 스큐'],['pc_vol','풋/콜 거래량'],['pc_oi','풋/콜 미결제'],
    ['gex_musd','감마(백만$)'],['call_wall','콜월'],['put_wall','풋월'],['short','공매도 비중']];
  return `<div class="tw"><table><thead><tr>${C.map(([k,n])=>`<th data-k="${k}">${n}${SORT.k===k?(SORT.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr><td>${esc(r.s)}</td><td>${f(r.price)}</td><td>${f(r.iv30,1)}</td><td>${f(r.atm_iv30,1)}</td><td>${f(r.skew25,1)}</td>`+
      `<td>${f(r.pc_vol)}</td><td>${f(r.pc_oi)}</td><td class="${r.gex_musd<0?'dn':''}">${f(r.gex_musd,0)}</td><td>${f(r.call_wall,0)}</td><td>${f(r.put_wall,0)}</td><td>${f(r.short,3)}</td></tr>`).join('')
  }</tbody></table></div>`;
}
let D=null;
function render(){
  const S=D.summary||[],L=D.latest||{},last=S[S.length-1]||{};
  document.getElementById('sub').textContent=`미국 ${L.date||'–'} 마감 기준 · 매 랩 실행(화~토 07:00 KST)마다 저장 · 기록 ${S.length}일`;
  let h='';
  if(S.length<60)h+=`<div class="card warn"><b>📦 기록을 쌓는 중이에요 (${S.length}일째).</b> 과거치를 나중에 받을 수 없는 옵션 수급·공매도·예측시장 상태를 매일 저장해요. 몇 달치가 모이면 국면별(공포/안정, 감마 양/음, 금리차 역전 등)로 랩 신호·전략 성과를 나눠 검증해요.</div>`;
  h+=`<div class="card" id="live" hidden></div>`;
  h+=`<div class="card"><h2>🌡️ 오늘의 환경</h2><p class="note">작은 선 = 기록된 날짜별 흐름. 꼬리표는 참고용 기준(아직 검증 전)이에요.</p><div class="tiles">${
    TILES.map(([k,n,d])=>{const v=last[k];const r=REG[k]&&v!=null?REG[k](v):null;const prev=S.length>1?S[S.length-2][k]:null;
      const ch=v!=null&&prev!=null?v-prev:null;
      return `<div class="tile"><div class="k">${n}${r?`<span class="tag ${r[0]}">${r[1]}</span>`:''}</div><div class="v">${f(v,d)}</div>`+
        `<div class="d">${ch==null?'&nbsp;':`전일 대비 <span class="${ch>0?'up':ch<0?'dn':''}">${ch>0?'+':''}${f(ch,d)}</span>`}</div>${spark(S.slice(-60).map(x=>x[k]))}</div>`;}).join('')
  }</div></div>`;
  h+=`<div class="card"><h2>🧩 옵션 수급 · 종목별</h2><p class="note">CBOE 옵션 전체 체인(장 마감 뒤 지연 시세)으로 계산 · IV = 내재변동성(%) · 25Δ 스큐 = 25델타 풋 IV − 콜 IV(클수록 하락 대비 수요) · `+
    `감마 = 1% 움직일 때 딜러 헤지 규모 추정(양수면 변동 억제, 음수면 확대 — 딜러가 콜 매도·풋 매수 쪽이라는 통상 가정) · 콜월/풋월 = 30일 안 만기 미결제약정이 가장 많은 행사가 · 공매도 비중 = FINRA 그날 공매도 거래량 ÷ 전체 · 머리글을 누르면 정렬</p><div id="opt">${optTable(L)}</div></div>`;
  const pm=L.polymarket||[];
  h+=`<div class="card"><h2>🎲 예측시장 (Polymarket)</h2><p class="note">경제·연준·정치·지정학 시장 중 최근 24시간 거래가 많은 순 · 숫자 = '예' 확률</p>${
    pm.length?pm.slice(0,30).map(x=>`<div class="pm"><span>${esc(x.q)}</span><span class="p">${Math.round(x.yes*100)}%</span><div class="bar"><i style="width:${x.yes*100}%"></i></div><span class="e">${esc(x.event)} · 24시간 거래 $${Math.round(x.vol24).toLocaleString()} · 마감 ${esc(x.end)}</span></div>`).join(''):'<div class="empty">데이터 없음</div>'
  }</div>`;
  const errs=Object.keys(L.errors||{});
  if(errs.length)h+=`<div class="card"><p class="note">이번에 못 받은 항목: ${esc(errs.join(', '))}</p></div>`;
  document.getElementById('app').innerHTML=h;
  if(LIVE)renderLive();
  document.querySelectorAll('#opt th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT=SORT.k===k?{k,d:-SORT.d}:{k,d:k==='s'?1:-1};render();});
}
// 장중 옵션 수급 (미니 블벅터가 15분마다 CBOE 15분 지연 시세로 계산)
let LIVE=null;
function renderLive(){
  const O=LIVE,el=document.getElementById('live');if(!el||!O||!O.latest||!Object.keys(O.latest).length)return;
  const L=O.latest,S=O.series||{};
  const rows=Object.entries(L).map(([s,x])=>`<tr><td>${esc(s)}</td><td>${f(x.price)}</td><td>${f(x.pc_vol)}</td><td>${f(x.pc_oi)}</td><td>${f(x.atm_iv30,1)}</td><td>${f(x.skew25,1)}</td>`+
    `<td class="${x.gex_musd<0?'dn':''}">${f(x.gex_musd,0)}</td><td>${f(x.call_wall,0)}</td><td>${f(x.put_wall,0)}</td><td style="min-width:80px">${spark((S[s]||{}).pc_vol||[])}</td></tr>`).join('');
  el.innerHTML=`<h2>⏱️ 장중 옵션 수급 <span class="hsub">${esc(O.date)} · ${O.session?'장중':'마지막'} ${esc(O.times.slice(-1)[0]||'')} KST · 오늘 ${O.times.length}회 기록 (15분 간격, CBOE 15분 지연)</span></h2>`+
    `<p class="note">CBOE 전체 풋/콜 ${O.pc&&O.pc.total!=null?`${O.pc.total} (주식 ${O.pc.equity}, 지수 ${O.pc.index})`:'–'} · 거래량 풋/콜에는 당일 만기(0DTE) 포함 · 마지막 칸 = 풋/콜 거래량 장중 흐름</p>`+
    `<div class="tw"><table><thead><tr><th>종목</th><th>가격</th><th>풋/콜 거래량</th><th>풋/콜 미결제</th><th>ATM IV</th><th>25Δ 스큐</th><th>감마(백만$)</th><th>콜월</th><th>풋월</th><th>흐름</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  el.hidden=false;
}
fetch('https://mini-bbterminal.pages.dev/briefings/options_live.json',{cache:'no-store'}).then(r=>r.json()).then(o=>{LIVE=o;renderLive();}).catch(()=>{});
setInterval(()=>fetch('https://mini-bbterminal.pages.dev/briefings/options_live.json',{cache:'no-store'}).then(r=>r.json()).then(o=>{LIVE=o;renderLive();}).catch(()=>{}),5*60e3);
fetch('env.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;render();})
  .catch(()=>{document.getElementById('app').innerHTML='<div class="card empty">아직 환경 기록이 없어요. 다음 랩 실행(화~토 07:00 KST)부터 쌓여요.</div>';document.getElementById('sub').textContent='';});
</script>
</body>
</html>
