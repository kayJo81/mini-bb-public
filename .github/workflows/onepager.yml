# 실적 원페이퍼(A4 한 장 요약, 차트·일러스트) → PDF·PNG → 메일 (본문에 이미지, PDF 첨부) — 수동 실행용
#  · 내용: lab/onepager/<id>.json (심층 뉴스 기사에서 뽑은 숫자·발언), 그리는 코드: scripts/onepager.py
# 필요한 저장소 Secrets: GMAIL_USER, GMAIL_APP_PASSWORD, 선택 MAIL_TO
name: onepager

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "보낼 원페이퍼 id (쉼표로 구분, 예: spacex-3q26,netflix-3q26). 비우면 전부"
        default: ""
      transcripts:
        description: "어닝콜 녹취록 PDF도 함께 (lab/onepager/transcripts.json 의 출처에서 받아 만듦)"
        type: boolean
        default: false
      callmap:
        description: "원페이퍼 대신 어닝콜 지도(lab/onepager/<id>-call.json) + 녹취록 한국어 번역 PDF"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          pip install -q playwright requests beautifulsoup4 lxml pypdf
          python -m playwright install --with-deps chromium >/dev/null
      - name: Build and mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.callmap }}" = "true" ]; then
            python scripts/callmap.py --out reports_onepager --mail --ids "${{ inputs.ids }}"
          else
            python scripts/onepager.py --out reports_onepager --mail --ids "${{ inputs.ids }}" ${{ inputs.transcripts && '--transcripts' || '' }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onepager
          # 녹취록 PDF는 저작권이 원 출처에 있어 공개 저장소의 실행 결과에 올리지 않음(메일로만)
          path: |
            reports_onepager/*
            !reports_onepager/*_녹취록*.pdf
          retention-days: 14
