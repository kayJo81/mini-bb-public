# 미니 블벅터 KR(장중 테마) — 정적 화면 + Pages Functions(네이버 증권 시세를 엣지에서 40초 캐시)
#  · 수집 작업 없이 방문자가 볼 때 Cloudflare 가 직접 받아오므로, kr/ 가 바뀔 때만 배포
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: kr

on:
  push:
    branches: [main]
    paths: ["kr/**", ".github/workflows/kr.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_PROJECT: mini-bbterminal-kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kr
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy public --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
