# 임시: 물가 데이터 출처 접속 확인 (확인 뒤 삭제)
name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash {0}
        run: |
          t() { echo "== $1"; rm -f /tmp/o; curl -sS -m 20 -o /tmp/o -w "%{http_code} %{time_total}s %{size_download}B\n" "${@:2}" || echo fail; head -c 300 /tmp/o 2>/dev/null; echo; }
          t fred-ua -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL,PCEPI&cosd=2026-01-01"
          t fred-curl "https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCEPI&cosd=2026-01-01"
          t bls-v1 -X POST https://api.bls.gov/publicAPI/v1/timeseries/data/ -H 'Content-Type: application/json' -d '{"seriesid":["CUSR0000SA0","WPSFD4"],"startyear":"2026","endyear":"2026"}'
          t bls-v2 -X POST https://api.bls.gov/publicAPI/v2/timeseries/data/ -H 'Content-Type: application/json' -d '{"seriesid":["CUSR0000SA0","PCU518210518210"],"startyear":"2026","endyear":"2026"}'
          t bls-file -A "Mozilla/5.0 (mini-bblab; yidiar80k@gmail.com)" "https://download.bls.gov/pub/time.series/cu/cu.data.0.Current"
          t dbnomics "https://api.db.nomics.com/v22/series/BLS/cu/CUSR0000SA0?observations=1"
          t dbn-bea "https://api.db.nomics.com/v22/series/BEA/NIPA-T20804?observations=1&limit=3"
          t alfred "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=PCEPI"
          t bea-api "https://apps.bea.gov/api/data?UserID=x&method=GETDATASETLIST"
          t bls-www -A "Mozilla/5.0 (mini-bblab; yidiar80k@gmail.com)" "https://www.bls.gov/"
