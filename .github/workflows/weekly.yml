# 주간 전략 PDF (이번 주 매크로·정치·산업·실적 일정 + 주간 전략) → 메일 + 랩 '주간 전략' 칸
#  · 매주 일요일 20:00 KST scheduler/ 가 실행 (수동 실행도 가능)
# 필요한 저장소 Secrets: GMAIL_USER, GMAIL_APP_PASSWORD, 선택 MAIL_TO
name: weekly

on:
  workflow_dispatch:

permissions:
  contents: write   # 랩 화면용 weekly.json 을 lab-data 브랜치에 저장

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          pip install -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Build weekly PDF
        run: python scripts/weekly_pdf.py --out reports_weekly --json reports_weekly/weekly.json
      # 랩 '주간 전략' 칸: lab-data 브랜치의 weekly.json 을 화면이 바로 읽음
      - name: Save weekly.json (lab-data)
        continue-on-error: true
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone --quiet --branch lab-data --single-branch --depth 1 "$REPO_URL" labdata
          cp reports_weekly/weekly.json labdata/weekly.json
          cd labdata && git add weekly.json
          git -c user.name="mini-bblab" -c user.email="actions@users.noreply.github.com" commit -qm "weekly $(date -u +%F)" || exit 0
          for i in 1 2 3; do
            git push -q origin lab-data && break
            git -c user.name="mini-bblab" -c user.email="actions@users.noreply.github.com" pull -q --rebase origin lab-data
          done

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-pdf
          path: reports_weekly/
          retention-days: 14
      - name: Send mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/send_mail.py reports_weekly
