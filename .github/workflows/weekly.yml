# 주간 전략 PDF (이번 주 매크로·정치·산업·실적 일정 + 주간 전략) → 메일 + 랩 '주간 전략' 칸
#  · 매주 일요일 20:00 KST scheduler/ 가 실행 (수동 실행도 가능)
# 필요한 저장소 Secrets: GMAIL_USER, GMAIL_APP_PASSWORD, 선택 MAIL_TO
name: weekly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          pip install -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Build weekly PDF
        run: python scripts/weekly_pdf.py --out reports_weekly --json reports_weekly/weekly.json
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-pdf
          path: reports_weekly/
          retention-days: 14
      - name: Send mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/send_mail.py reports_weekly
