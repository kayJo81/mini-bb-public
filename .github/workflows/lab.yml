# 미니 블벅 랩 — 종목 뉴스 집계·가격 저장(lab-data 브랜치) → 신호 검증 → Cloudflare Pages(mini-bblab) 배포
#  · 매일 07:00 KST(화~토, 미국 장 마감 뒤) scheduler/ 가 days=4 로 실행 (크론은 UTC 월~금 22:00)
#  · 처음 한 번은 days=365 로 수동 실행해 1년치 채우기 (Finnhub 무료 한도 때문에 약 1시간)
# 필요한 저장소 Secrets: FINNHUB_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, 선택 LAB_EDIT_KEY(주간 전략 일정 직접 입력용 편집 키)
name: lab

on:
  workflow_dispatch:
    inputs:
      days:
        description: "다시 받을 뉴스 기간(일). 처음 채울 땐 365"
        default: "4"

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: false

env:
  CF_PROJECT: mini-bblab
  LAB_DATA: labdata

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Checkout lab-data branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads origin lab-data >/dev/null; then
            git clone --quiet --branch lab-data --single-branch --depth 1 "$REPO_URL" labdata
          else
            mkdir labdata && cd labdata && git init -q -b lab-data && git remote add origin "$REPO_URL"
          fi

      - name: Prices
        run: python lab/prices.py

      - name: News (Finnhub)
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python lab/update_news.py --days "${{ inputs.days || '4' }}"

      # 시장 환경 스냅샷 (옵션 수급·VIX 구조·금리·공매도·예측시장) — 과거치를 나중에 못 받는 것들을 매일 저장
      - name: Market environment snapshot
        continue-on-error: true
        env:
          LAB_OUT: public_lab
        run: python lab/env_snapshot.py

      - name: Signals
        run: |
          python lab/signals.py --out public_lab
          python lab/paper.py --signals public_lab/data.json --out public_lab
          cp lab/site.html public_lab/index.html
          cp lab/site.html public_lab/sim.html
          cp lab/env.html public_lab/env.html
          cp lab/weekly.html public_lab/weekly.html

      - name: Save data
        if: always()
        working-directory: labdata
        run: |
          git add -A
          git -c user.name="mini-bblab" -c user.email="actions@users.noreply.github.com" commit -qm "data $(date -u +%F' '%H:%M)" || exit 0
          # 같은 브랜치에 주간 전략(weekly.yml)이 먼저 저장했으면 받아서 합친 뒤 다시 (최대 3번)
          for i in 1 2 3; do
            git push -q origin lab-data && break
            git -c user.name="mini-bblab" -c user.email="actions@users.noreply.github.com" pull -q --rebase origin lab-data
          done

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAB_EDIT_KEY: ${{ secrets.LAB_EDIT_KEY }}
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          # 랩 전용 배포 폴더: 함수(lab/functions: 주간 전략 직접 입력 api/events) + KV 연결
          mkdir -p labsite && cp -r lab/functions labsite/functions
          printf 'name = "%s"\npages_build_output_dir = "../public_lab"\ncompatibility_date = "2024-09-01"\n' "$CF_PROJECT" > labsite/wrangler.toml
          find_id() { npx --yes wrangler@3 kv namespace list 2>/dev/null | python3 scripts/kv_id.py MBB_LAB_EVENTS; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx --yes wrangler@3 kv namespace create MBB_LAB_EVENTS >/dev/null || true; ID=$(find_id); fi
          if [ -n "$ID" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "EVENTS"\nid = "%s"\n' "$ID" >> labsite/wrangler.toml
          else
            echo "::warning::KV 를 만들지 못해 직접 입력 일정 없이 배포합니다"
          fi
          cd labsite
          if [ -n "$LAB_EDIT_KEY" ]; then
            printf '%s' "$LAB_EDIT_KEY" | npx --yes wrangler@3 pages secret put LAB_EDIT_KEY --project-name="$CF_PROJECT" >/dev/null || echo "::warning::편집 키를 넣지 못했어요"
          else
            echo "::warning::GitHub Secrets 에 LAB_EDIT_KEY 가 없어 랩 일정 입력은 읽기 전용입니다"
          fi
          npx --yes wrangler@3 pages deploy ../public_lab --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
