<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 블벅터 KR · 한국 증시</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#e5e7eb;--sub:#6b7280;--ink:#111827;--acc:#2563eb;--up:#dc2626;--dn:#2563eb;--r:14px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
a{color:inherit}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:.5px solid var(--bd)}
.brand{font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.02em}.brand em{font-style:normal;color:var(--up)}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 11px;background:#f3f4f6;color:#4b5563}
.pill.open{background:#fee2e2;color:#b91c1c}
.spacer{flex:1}
.hsub{font-size:12px;color:var(--sub)}
.btn{padding:8px 14px;border-radius:10px;border:.5px solid var(--bd);background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#374151;text-decoration:none;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:640px){.secs{grid-template-columns:1fr 1fr}}
.secs{grid-template-columns:repeat(6,1fr)}
@media(max-width:640px){.secs{grid-template-columns:1fr 1fr}}
/* 맵 (핀비즈 맵처럼: 크기 = 시가총액, 색 = 등락률 — 한국식 빨강 상승·파랑 하락) */
.mbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mtab{padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-weight:800;font-size:14px;cursor:pointer}
.mtab.on{background:#111827;color:#fff;border-color:#111827}
.midx{font-size:14px;font-weight:700}.midx b{font-family:var(--mono);font-size:16px}
.tmap{position:relative;width:100%;height:620px;background:#1f2330;border-radius:12px;overflow:hidden;user-select:none}
@media(max-width:640px){.tmap{height:560px}}
.tmap .sg{position:absolute;box-sizing:border-box;border:1px solid #1f2330}
.tmap .sg>i{position:absolute;left:0;right:0;top:0;height:15px;font:700 10.5px/15px var(--mono),sans-serif;font-style:normal;color:#e5e7eb;
  padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#1f2330}
.tmap .tl{position:absolute;box-sizing:border-box;border:1px solid #1f2330;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;cursor:pointer;line-height:1.1}
.tmap .tl b{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96%}
.tmap .tl span{font-family:var(--mono);font-size:11px;opacity:.95}
.tmap .tl.sel{outline:2px solid #fde047;outline-offset:-2px;z-index:2}
.mlegend{display:flex;gap:2px;align-items:center;margin-top:8px;font:600 11px var(--mono),sans-serif;color:var(--sub);flex-wrap:wrap}
.mlegend span{padding:2px 6px;border-radius:4px;color:#fff}
.minfo{margin-top:8px;font-size:14px;min-height:20px}.minfo a{font-weight:700;text-decoration:none}
.iss{background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #fed7aa;border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;min-width:0}
.iss-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.iss-n{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.iss a{text-decoration:none}.iss a:hover{color:var(--acc)}
.iss-a{font-size:13px;margin-top:5px;line-height:1.45;overflow-wrap:anywhere}
.ihd{font-weight:800;font-size:15px;margin:2px 2px 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.itag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:#ffedd5;color:#9a3412;margin-top:4px}
.why{margin-top:6px;font-size:13px;line-height:1.45;background:#fffbeb;border:.5px solid #fde68a;border-radius:8px;padding:5px 8px;overflow-wrap:anywhere}
.why a{text-decoration:none;font-weight:600}.why a:hover{color:var(--acc)}
.why .src{font-size:11.5px;color:var(--sub)}
.why.alt{background:#f9fafb;border-color:var(--bd)}
.sec{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.sec.on{border-color:#111827;box-shadow:0 0 0 2px #111827 inset}
.sec .t{font-weight:800;font-size:16px}.sec .s{font-size:13px;color:var(--sub);margin-top:2px}
.sec .s b{font-family:var(--mono);font-size:16px}
.ncats{background:#fff;border:.5px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.nav-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav-t{font-size:16px;font-weight:800}.nav-hint{font-size:12px;color:#6b7280}
.ng{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;line-height:1.2;color:#374151;
    margin:14px 0 7px;padding:4px 10px 4px 8px;border:1px dashed color-mix(in srgb,var(--gc) 45%,transparent);border-radius:999px;
    background:color-mix(in srgb,var(--gc) 7%,#fff);cursor:pointer}
.ng::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--gc)}
.ng .c{font-family:var(--mono);font-size:12px;font-weight:600;color:#4b5563}.ng .gh{font-size:11px;font-weight:500;color:#6b7280}
.ng.on{background:var(--gc);border:1px solid var(--gc);color:#fff}.ng.on::before{background:#fff}.ng.on .c,.ng.on .gh{color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.ni{--gc:#111827;display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 11px;border:1px solid var(--bd);border-radius:999px;
    background:#fff;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;color:#1f2937;white-space:nowrap}
.ni .c{font-family:var(--mono);font-size:12px;font-weight:600;min-width:22px;text-align:center;padding:2px 6px;border-radius:999px;background:#f3f4f6;color:#4b5563}
.ni.on{background:var(--gc);border-color:var(--gc);color:#fff}.ni.on .c{background:rgba(255,255,255,.25);color:#fff}
.ni.on::before{content:"✓";font-size:11px;font-weight:700;margin-right:-2px}.ni.empty{opacity:.45}
.ni.all{--gc:#111827;font-size:15px;padding:8px 8px 8px 14px}
.ngap{height:10px}
.nw{background:var(--card);border:.5px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;min-width:0}
.nr1{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.tb{font-family:var(--mono);font-size:12px;font-weight:700;background:#111827;color:#fff;border-radius:6px;padding:1px 7px}
.vb{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px}
.v-VERIFIED{background:#dcfce7;color:#166534}.v-SINGLE{background:#fef3c7;color:#92400e}.v-UNVERIFIED{background:#f3f4f6;color:#4b5563}
.tg{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:#eef2ff;color:#3730a3}
.nh{font-weight:600;font-size:15px;text-decoration:none;line-height:1.45;overflow-wrap:anywhere}.nh:hover{color:var(--acc)}
.nw details{font-size:12.5px;color:var(--sub);margin-top:4px}.nw summary{cursor:pointer}
.nw details div{padding:2px 0;overflow-wrap:anywhere}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sm{flex:1 1 140px;background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:8px 12px;box-shadow:var(--sh);min-width:0}
.sm b{font-family:var(--mono);font-size:17px;display:block}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap;align-items:center}
.tab{padding:8px 15px;border-radius:999px;border:.5px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:#111827;color:#fff;border-color:#111827}
#q{flex:1 1 140px;min-width:0;padding:7px 12px;border-radius:999px;border:.5px solid var(--bd);font:inherit;font-size:13px}
.th{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px;min-width:0}
.th-h{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:10px 12px;cursor:pointer}
.rk{font-family:var(--mono);font-weight:700;color:var(--sub);text-align:center;font-size:13px}
.nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.chg{font-family:var(--mono);font-weight:700;font-size:19px;text-align:right;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;color:var(--sub)}
.breadth{display:inline-flex;width:70px;height:6px;border-radius:3px;overflow:hidden;background:#dbeafe;vertical-align:middle}
.breadth i{display:block;height:100%;background:#f87171}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12.5px;border-radius:6px;padding:1px 7px;background:#f9fafb;border:.5px solid var(--bd);white-space:nowrap}
.chip b{font-family:var(--mono)}
.new{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;background:#fef3c7;color:#92400e}
.mv{font-family:var(--mono);font-size:10px;font-weight:700}
.det{border-top:.5px dashed var(--bd);padding:10px 12px 12px}
.desc{font-size:13.5px;color:#374151;margin:0 0 8px;line-height:1.55}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{padding:6px 6px;border-bottom:.5px solid var(--bd);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:600}
td:first-child,th:first-child{text-align:left;white-space:normal}
tr.st{cursor:pointer}tr.st:hover td{background:#f9fafb}
.sn{font-weight:600}.mk{font-size:10px;color:var(--sub);margin-left:4px}
.info{font-size:13px;color:#374151;background:#f9fafb;white-space:normal!important;text-align:left!important;line-height:1.5}
.news{list-style:none;margin:6px 0 0;padding:0}
.news li{padding:5px 0;border-top:.5px dashed var(--bd);font-size:13.5px;overflow-wrap:anywhere}
.news a{text-decoration:none}.news a:hover{color:var(--acc)}
.tm{font-family:var(--mono);font-size:10px;color:var(--sub);margin-right:5px}
.empty{color:var(--sub);font-size:13px;padding:14px 4px}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
@media(max-width:640px){.flow{gap:6px}}
.fc{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:9px 11px 6px;min-width:0}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:800;font-size:14px}
.fh span{font-size:11px;font-weight:500;color:var(--sub);white-space:nowrap}
.fr{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.fr b{font-family:var(--mono);text-align:right;white-space:nowrap}
.fr.sub{font-size:12px;color:#4b5563;padding-left:10px}.fr.sub b{font-weight:600}
.fbar{height:3px;border-radius:2px;margin-top:1px;grid-column:1/-1;background:#f3f4f6;position:relative;overflow:hidden}
.fbar i{position:absolute;top:0;bottom:0}
.fsvg{display:block;width:100%;height:34px;margin-top:4px}
.fleg{display:flex;gap:8px;font-size:10.5px;color:var(--sub);margin-top:1px;flex-wrap:wrap}
.fleg i{display:inline-block;width:8px;height:2px;vertical-align:middle;margin-right:3px}
.fdet{font-size:11.5px;color:var(--sub);margin-top:3px;cursor:pointer}
.fdet summary{list-style:none}.fdet summary::-webkit-details-marker{display:none}
.fdet div{display:flex;justify-content:space-between;font-family:var(--mono);padding:1px 0}
.hotbox{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:4px 12px}.hb{padding:8px 0;border-bottom:.5px dashed var(--bd)}.hb:last-child{border-bottom:0}
.hb1{font-size:14.5px}.hb .chips{margin-top:4px}
/* 📑 리포트 */
.rp-card{background:#fff;border:.5px solid var(--bd);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:12px 14px;margin:0 0 12px}
.rp-h{font-weight:800;font-size:16px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rp-h span{font-size:11.5px;font-weight:500;color:var(--sub)}
.rp-g{font-weight:800;font-size:14px;margin:10px 0 2px}
.rp-i{padding:7px 0;border-top:.5px dashed var(--bd);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.rp-i a{text-decoration:none;color:inherit}.rp-i a:hover{color:var(--acc)}
.rp-m{font-size:11.5px;color:var(--sub);margin-top:2px}
.rp-f{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:#ecfeff;color:#0e7490;margin-right:5px}
.rp-s{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:#f5f3ff;color:#6d28d9;margin-right:5px}
footer{font-size:11px;color:var(--sub);text-align:center;padding:16px 0}
/* 📊 주요 지표 (환율·달러지수·비트코인·금·금리) */
.mx{background:#fff;border:.5px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:10px 12px;margin:0 0 12px}
.mx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:15px;margin-bottom:6px}
.mx-h span{font-size:11px;font-weight:500;color:#6b7280}
.mx-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media(min-width:760px){.mx-g{grid-template-columns:repeat(8,minmax(0,1fr))}}
.mx-t{border:.5px solid #eef0f3;border-radius:9px;padding:5px 6px;min-width:0;background:#fafbfc}
.mx-n{font-size:11.5px;font-weight:700;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-p{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:-.02em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-c{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-c.u{color:#dc2626}.mx-c.d{color:#2563eb}.mx-c.f{color:#6b7280}
</style>
</head>
<body>
<div id="bar">
  <a class="brand" href="./">미니 블벅터 <em>KR</em> <span style="font-size:14px;font-weight:700;color:#6b7280">한국 증시용</span></a>
  <span class="pill" id="mst">—</span>
  <span class="hsub" id="upd"></span>
  <div class="spacer"></div>
  <button class="btn" id="rbtn">↻ 새로고침</button>
  <a class="btn" href="https://mini-bbterminal.pages.dev">🇺🇸 미국 증시</a>
</div>
<div class="wrap">
  <div class="mx" id="mx" hidden><div class="mx-h">📊 주요 지표 <span id="mxAt"></span></div><div class="mx-g" id="mxG"></div></div>
  <div class="flow" id="flow" hidden></div>
  <div class="secs" id="secs">
    <button class="sec" data-sec="theme"><div class="t">🔥 장중 테마</div><div class="s" id="secTheme">불러오는 중…</div></button>
    <button class="sec" data-sec="산업"><div class="t">🏭 산업</div><div class="s" data-cnt="산업">뉴스</div></button>
    <button class="sec" data-sec="매크로"><div class="t">🌐 매크로</div><div class="s" data-cnt="매크로">뉴스</div></button>
    <button class="sec" data-sec="정치·정책"><div class="t">🏛️ 정치·정책</div><div class="s" data-cnt="정치·정책">뉴스</div></button>
    <button class="sec map" data-sec="map"><div class="t">🗺️ 맵</div><div class="s" id="secMap">코스피·코스닥 한눈에</div></button>
    <button class="sec" data-sec="report"><div class="t">📑 리포트</div><div class="s" id="secRep">증권사 매크로·산업·기업</div></button>
  </div>
  <div id="mapView" hidden>
    <div class="mbar"><button class="mtab" data-m="KOSPI">코스피</button><button class="mtab" data-m="KOSDAQ">코스닥</button>
      <span class="midx" id="midx"></span></div>
    <div class="tmap" id="tmap"><div class="empty" style="color:#e5e7eb">불러오는 중…</div></div>
    <div class="mlegend" id="mleg"></div>
    <div class="minfo hsub" id="minfo">시가총액 상위 200종목 · 업종별 · 타일 크기 = 시가총액, 색 = 등락률 · 타일을 누르면 자세히</div>
  </div>
  <div id="repView" hidden></div>
  <div id="newsView" hidden><div class="ncats" id="ncats"></div><div id="nlist"><div class="empty">불러오는 중…</div></div></div>
  <div id="themeView">
  <div id="sum"></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <div class="tabs" style="margin-top:14px"><input id="q" placeholder="🔎 다른 테마 찾기 (예: 반도체, 원자력)"></div>
  <div id="qlist"></div>
  </div>
  <footer>수급: 다음 금융 투자자별 순매수(억 원, 장중 30초마다 · 순수기관 = 기관계 − 금융투자) · 테마: 네이버 증권 테마 분류·시세 (최대 1분 지연, 장중 30초마다 갱신) · 뉴스: 구글 뉴스 한국판 직전 24시간, 15분마다 수집 · 투자 권유 아님</footer>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 링크는 http·https 주소만 (javascript: 같은 주소가 섞여 들어와도 실행되지 않게)
const safeUrl=u=>/^https?:\/\//i.test(String(u??'').trim())?esc(u):'#';
const pct=v=>v==null?'–':`${v>0?'+':''}${v.toFixed(2)}%`;
const cls=v=>v>0?'up':v<0?'dn':'';
const eok=v=>v==null?'–':v>=100?`${Math.round(v/100).toLocaleString()}억`:`${v}백만`;
const st={view:'up',q:'',open:new Set(),data:null};
let timer=null,nextAt=0;

// 순위 변화: 이 화면을 연 뒤 받은 순위를 기억했다가 약 5분 전과 비교
function rankHistory(groups){
  let h=[];try{h=JSON.parse(sessionStorage.getItem('kr_rank')||'[]');}catch(e){}
  const now=Date.now(),order=groups.map(g=>g.no);
  h.push({t:now,o:order});h=h.filter(x=>now-x.t<20*60e3).slice(-60);
  try{sessionStorage.setItem('kr_rank',JSON.stringify(h));}catch(e){}
  const base=h.find(x=>now-x.t>=4*60e3&&now-x.t<=10*60e3)||h[0];
  const prev=new Map(base.o.map((n,i)=>[n,i]));
  return {move:no=>{const p=prev.get(no);return p==null?null:p-order.indexOf(no);},mins:Math.round((now-base.t)/60e3)};
}

// 투자자별 수급 (개인 / 외국인 / 기관계 = 순수기관 + 금융투자), 억 원
const FC={ind:'#f59e0b',frn:'#10b981',inst:'#8b5cf6'};
function flowSvg(S){
  if(!S||S.length<2)return '';
  const all=S.flatMap(r=>r.slice(1)),mx=Math.max(1,...all.map(Math.abs)),n=S.length;
  const y=v=>(17-v/mx*15).toFixed(1),line=(k,c)=>`<polyline points="${S.map((r,i)=>`${(i/(n-1)*100).toFixed(1)},${y(r[k])}`).join(' ')}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  return `<svg class="fsvg" viewBox="0 0 100 34" preserveAspectRatio="none"><line x1="0" x2="100" y1="17" y2="17" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke"/>${line(1,FC.ind)}${line(2,FC.frn)}${line(3,FC.inst)}</svg>`;
}
async function loadFlow(){
  try{
    const d=await (await fetch('api/flow',{cache:'no-store'})).json();if(d.error)return;
    const f=v=>v==null?'–':(v>0?'+':'')+v.toLocaleString(),c=v=>v>0?'up':v<0?'dn':'';
    const card=(name,x)=>{
      const mx=Math.max(1,...[x.ind,x.frn,x.inst].map(v=>Math.abs(v||0)));
      const bar=(v,col)=>`<div class="fbar"><i style="background:${col};${v>=0?'left:50%':'right:50%'};width:${Math.abs(v||0)/mx*50}%"></i></div>`;
      const row=(l,v,col,sub)=>`<div class="fr${sub?' sub':''}"><span>${l}</span><b class="${c(v)}">${f(v)}</b>${col?bar(v,col):''}</div>`;
      const det=Object.entries(x.detail||{}).map(([k,v])=>`<div><span>${k}</span><span class="${c(v)}">${f(v)}</span></div>`).join('')+
        `<div><span>기타법인</span><span class="${c(x.corp)}">${f(x.corp)}</span></div>`;
      return `<div class="fc"><div class="fh">${name}<span>${x.at.slice(5,10).replace('-','/')} ${x.at.slice(11,16)} · 억 원</span></div>
        ${row('개인',x.ind,FC.ind)}${row('외국인',x.frn,FC.frn)}${row('기관계',x.inst,FC.inst)}${row('ㄴ 순수기관',x.pure,'',1)}${row('ㄴ 금융투자',x.fin,'',1)}
        ${flowSvg(x.series)}<div class="fleg"><span><i style="background:${FC.ind}"></i>개인</span><span><i style="background:${FC.frn}"></i>외국인</span><span><i style="background:${FC.inst}"></i>기관</span></div>
        <details class="fdet"><summary>▸ 기관 세부</summary>${det}</details></div>`;
    };
    const el=document.getElementById('flow'),open=[...el.querySelectorAll('details')].map(x=>x.open);
    el.innerHTML=card('코스피',d.KOSPI)+card('코스닥',d.KOSDAQ);
    el.querySelectorAll('details').forEach((x,i)=>x.open=!!open[i]);
    el.hidden=false;
  }catch(e){}
}
async function load(){
  loadFlow();

  schedule();
}
function schedule(){
  clearTimeout(timer);const open=st.data&&st.data.status==='OPEN';
  const ms=open?30e3:300e3;nextAt=Date.now()+ms;timer=setTimeout(load,ms);
}
setInterval(()=>{const s=Math.max(0,Math.round((nextAt-Date.now())/1e3));const at=st.data?new Date(st.data.at):null;
  document.getElementById('upd').textContent=at?`${at.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} 기준 · ${s}초 뒤 갱신`:'';},1000);

function render(){
  const d=st.data;if(!d)return;
  const open=d.status==='OPEN',ms=document.getElementById('mst');
  ms.textContent=open?'● 장중':'장 마감';ms.className='pill'+(open?' open':'');

// ── 강세(약세) 이유: 테마마다 /api/why (대장주 뉴스 → 구글 뉴스 → 관련 뉴스 → 테마 개요 순으로 찾음) ──
const why=new Map();   // no → {at, d}
async function loadReasons(list){
  list.forEach(paintWhy);
  const todo=list.filter(g=>{const w=why.get(g.no);return !w||Date.now()-w.at>300e3;});
  let i=0;
  const worker=async()=>{while(i<todo.length){const g=todo[i++];
    try{const d=await (await fetch(`api/why/${g.no}`)).json();if(!d.error){why.set(g.no,{at:Date.now(),d});paintWhy(g);}}catch(e){}}};
  await Promise.all(Array.from({length:6},worker));
}
function paintWhy(g){
  const el=document.querySelector(`[data-why="${g.no}"]`),w=why.get(g.no);if(!el||!w)return;
  const d=w.d,tm=d.ts?new Date(d.ts).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'';
  const up=g.chg>=0;
  if(d.kind==='reason')el.innerHTML=`💡 <b>${up?'강세':'약세'} 이유</b> <a href="${safeUrl(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> <span class="src">· ${d.stock?esc(d.stock)+' 관련 · ':''}${esc(d.office||'')} ${tm}</span>`;
  else if(d.kind==='related')el.innerHTML=`📰 <b>관련 뉴스</b> <a href="${safeUrl(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> <span class="src">· ${esc(d.stock||'')} · ${esc(d.office||'')} ${tm}</span>`;
  else el.innerHTML=`📌 <b>테마 개요</b> ${esc(d.desc||'')}${d.info?`<br><span class="src">${esc(d.stock)}: ${esc(d.info)}…</span>`:''}`;
  el.classList.toggle('alt',d.kind!=='reason');el.hidden=!(d.title||d.desc||d.info);
}
// 🚀 급등주가 몰린 테마: 테마 평균은 낮아도 +5% 넘은 종목이 2개 이상 (예: 남북경협 평균 −1.6%, 양지사 +13.8%·다스코 +7.9%)
// 순서: 두 번째로 많이 오른 종목 등락률 × √급등주 수 (한 종목만 튄 테마보다 여러 종목이 함께 오른 테마 먼저), 최대 10개
function hotBox(G){
  const H=G.filter(g=>g.hot&&(g.hotStocks||[]).length>1).map(g=>({g,sc:g.hotStocks[1].chg*Math.sqrt(g.hot)})).sort((a,b)=>b.sc-a.sc).slice(0,10);
  if(!H.length)return '';
  return `<div class="ihd" style="margin-top:14px">🚀 급등주가 몰린 테마 <span class="hsub">테마 평균과 상관없이 +5% 넘은 종목이 2개 이상</span></div><div class="card hotbox">`+
    H.map(({g})=>`<div class="hb"><div class="hb1"><b>${esc(g.name)}</b> <span class="hsub">급등주 ${g.hot}개 · 테마 평균 <span class="${cls(g.chg)}">${pct(g.chg)}</span></span></div>`+
      `<div class="chips">${(g.hotStocks||[]).map(s=>`<span class="chip">${esc(s.name)} <b class="up">${pct(s.chg)}</b></span>`).join('')}</div></div>`).join('')+'</div>';
}
function card(g,rank){
  const mv=st.rh?st.rh.move(g.no):null;
  const mvs=mv?`<span class="mv ${mv>0?'up':'dn'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:'';
  const hot=mv!=null&&mv>=8&&rank<=20?'<span class="new">🚀 급부상</span>':'';
  const ratio=g.total?Math.round(g.rise/g.total*100):0;
  const chips=(g.leaders||[]).map(s=>`<span class="chip">${esc(s.name)} <b class="${cls(s.chg)}">${pct(s.chg)}</b></span>`).join('');
  return `<div class="th" id="t${g.no}"><div class="th-h" data-no="${g.no}">
    <span class="rk">${rank}</span>
    <div style="min-width:0"><div class="nm">📂 ${esc(g.name)} ${hot}</div>
      ${issueTag(g)}
      <div class="meta"><span class="breadth" title="오른 종목 비율"><i style="width:${ratio}%"></i></span><span>▲${g.rise} ▼${g.fall} / ${g.total}종목</span>
      ${g.value?`<span>거래대금 ${eok(g.value)}</span>`:''}${mvs?`<span>${st.rh.mins}분 전 대비 ${mvs}</span>`:''}</div>
      ${chips?`<div class="chips">${chips}</div>`:''}<div class="why" data-why="${g.no}" hidden></div></div>
    <span class="chg ${cls(g.chg)}">${pct(g.chg)}</span></div><div class="det" hidden></div></div>`;
}
// ── 오늘의 이슈 테마: 같은 뉴스로 함께 급등한 종목 묶음 (/api/issues, 5분) ──
const iss={up:[],dn:[],byCode:new Map(),at:0};
async function loadIssues(){
  if(Date.now()-iss.at<240e3)return;

    const [u,d]=await Promise.all(['up','down'].map(x=>fetch('api/issues?dir='+x).then(r=>r.json())));

function renderNews(){
  const d=ns.data;if(!d)return;
  const at=new Date(d.generated_at);
  const hm=at.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('[data-cnt]').forEach(el=>{const n=d.topics.filter(t=>t.section===el.dataset.cnt).reduce((a,t)=>a+t.count,0);

  if(sec==='theme')return;
  const T=d.topics.filter(t=>t.section===sec),tot=T.reduce((a,t)=>a+t.count,0);
  // 미국판처럼: 그룹(색 점·점선 테두리, 누르면 그룹 전체) 아래 세부 카테고리 버튼
  const GC={'K 테크':'#2563eb','K 조방원':'#059669','K 바이오':'#db2777','K 모빌리티':'#0891b2','K 금융':'#ca8a04','K 정책':'#7c3aed'};
  const isOn=t=>ns.sel.has(t.id)||ns.sel.has('G:'+(t.group||''));
  const pill=(t,gc)=>`<button type="button" class="ni ${isOn(t)?'on':''} ${t.count?'':'empty'}" style="--gc:${gc}" data-c="${t.id}"><span>${esc(t.name)}</span><span class="c">${t.count}</span></button>`;
  const groups=[];for(const t of T){const k=t.group||'';let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,ts:[]});g.ts.push(t);}
  document.getElementById('ncats').innerHTML=
    `<div class="nav-h"><span class="nav-t">${esc(sec)} 카테고리</span><span class="nav-hint">👆 여러 개 골라 보기</span></div>`+
    `<div class="pills"><button type="button" class="ni all ${ns.sel.size?'':'on'}" data-c="ALL"><span>전체</span><span class="c">${tot}</span></button></div>`+
    groups.map(g=>{const gc=GC[g.k]||'#2563eb',on=ns.sel.has('G:'+g.k);
      return (g.k?`<div><button type="button" class="ng ${on?'on':''}" style="--gc:${gc}" data-c="G:${esc(g.k)}">${esc(g.k)}<span class="c">${g.ts.reduce((a,t)=>a+t.count,0)}</span><span class="gh">${on?'✓ 선택됨':'그룹 전체 보기'}</span></button></div>`:'<div class="ngap"></div>')+
        `<div class="pills">${g.ts.map(t=>pill(t,gc)).join('')}</div>`;}).join('');
  const seen=new Set(),items=[];
  for(const t of T){if(ns.sel.size&&!isOn(t))continue;

  items.sort((a,b)=>b[0].first_seen-a[0].first_seen);
  document.getElementById('nlist').innerHTML=(items.length?items.map(([x,cat])=>{
    const tm=x.first_seen_kst.replace('-','/');
    return `<div class="nw"><div class="nr1"><span class="tb">${esc(tm)}</span><span class="vb v-${x.verdict}">${VL[x.verdict]}</span><span class="tg">${esc(cat)}</span><span class="hsub">출처 ${x.n_sources}</span></div>
      <a class="nh" href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.headline)}</a>
      ${x.sources.length>1?`<details><summary>보도 ${x.sources.length}건 보기</summary>${x.sources.map(s=>`<div><span class="tm">${esc(s.time_kst.slice(6))}</span><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(s.headline)}</a> · ${esc(s.name)}</div>`).join('')}</details>`:`<div class="hsub" style="margin-top:3px">${esc(x.sources[0].name)}</div>`}</div>`;}).join('')
    :'<div class="empty">해당 카테고리 뉴스가 없어요.</div>');
}
// 카테고리 여러 개 고르기: 누르면 켜고/끄기, '전체'는 모두 해제 (그룹을 켜면 그 안의 개별 카테고리는 그룹에 포함)
document.getElementById('ncats').addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(!c)return;const k=c.dataset.c,T=(ns.data||{}).topics||[];
  if(k==='ALL')ns.sel.clear();
  else{const tp=T.find(t=>t.id===k),g=tp&&'G:'+(tp.group||'');
    if(tp&&ns.sel.has(g)){ns.sel.delete(g);T.filter(t=>t.group===tp.group&&t.id!==k&&t.section===tp.section).forEach(t=>ns.sel.add(t.id));}
    else if(ns.sel.has(k))ns.sel.delete(k);
    else{ns.sel.add(k);if(k.startsWith('G:'))T.filter(t=>'G:'+t.group===k).forEach(t=>ns.sel.delete(t.id));}}
  renderNews();});
document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>setSec(b.dataset.sec));
// ── 맵: 업종별 시가총액 타일 (squarified treemap) ──
const mp={m:'KOSPI',data:{},sel:null,timer:null};
try{mp.m=localStorage.getItem('kr_map')||'KOSPI';}catch(e){}
const MSTEPS=[[-3,'#1d4ed8'],[-2,'#2f5fbf'],[-1,'#3d5a8f'],[0,'#454b5c'],[1,'#8f3d45'],[2,'#c2333b'],[3,'#e11d2a']];
function mcolor(c){
  if(c<=MSTEPS[0][0])return MSTEPS[0][1];if(c>=MSTEPS[6][0])return MSTEPS[6][1];
  for(let i=0;i<6;i++){const[a,ca]=MSTEPS[i],[b,cb]=MSTEPS[i+1];if(c<=b){const t=(c-a)/(b-a),h=x=>parseInt(x,16);
    const mix=k=>Math.round(h(ca.substr(k,2))*(1-t)+h(cb.substr(k,2))*t).toString(16).padStart(2,'0');return '#'+mix(1)+mix(3)+mix(5);}}
}
function squarify(items,x,y,w,h){   // items: {v} 큰 순 → {x,y,w,h} 를 붙여 돌려준다
  const tot=items.reduce((a,i)=>a+i.v,0);if(!tot||w<=0||h<=0)return items;
  const k=w*h/tot,q=items.map(i=>({i,a:i.v*k}));
  const worst=(row,side)=>{const s=row.reduce((a,r)=>a+r.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));
    return Math.max(side*side*mx/(s*s),s*s/(side*side*mn));};
  let row=[];
  const place=()=>{const s=row.reduce((a,r)=>a+r.a,0);
    if(w>=h){const cw=s/h;let yy=y;for(const r of row){const rh=r.a/cw;Object.assign(r.i,{x,y:yy,w:cw,h:rh});yy+=rh;}x+=cw;w-=cw;}
    else{const rh=s/w;let xx=x;for(const r of row){const rw=r.a/rh;Object.assign(r.i,{x:xx,y,w:rw,h:rh});xx+=rw;}y+=rh;h-=rh;}
    row=[];};
  while(q.length){const side=Math.min(w,h),it=q[0];
    if(!row.length||worst(row.concat(it),side)<=worst(row,side)){row.push(it);q.shift();}else place();}
  if(row.length)place();
  return items;
}
const fmtCap=v=>v>=10000?(v/10000).toFixed(v>=100000?0:1)+'조':Math.round(v).toLocaleString()+'억';
async function loadMap(){
  clearTimeout(mp.timer);
  document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('on',b.dataset.m===mp.m));
  try{
    const r=await fetch('api/map?m='+mp.m);const d=await r.json();if(d.error)throw new Error(d.error);
    mp.data[mp.m]=d;renderMap();
    const o=mp.m==='KOSPI'?'KOSDAQ':'KOSPI';   // 맵 카드 요약(코스피·코스닥 등락률)용
    if(!mp.data[o])fetch('api/map?m='+o).then(r=>r.json()).then(x=>{if(!x.error){mp.data[o]=x;if(sec==='map')renderMap();else mapSummary();}}).catch(()=>{});
  }catch(e){document.getElementById('tmap').innerHTML=`<div class="empty" style="color:#e5e7eb">맵을 불러오지 못했어요 (${esc(e.message)})</div>`;}
  const open=(mp.data[mp.m]||{}).status==='OPEN';
  if(sec==='map')mp.timer=setTimeout(loadMap,open?30e3:300e3);
}
function renderMap(){
  const d=mp.data[mp.m];if(!d)return;
  const el=document.getElementById('tmap'),W=el.clientWidth,H=el.clientHeight,ix=d.index||{};
  const sgn=v=>v>0?'+':'';const cls=v=>v>0?'up':v<0?'dn':'';
  document.getElementById('midx').innerHTML=`${esc(ix.name)} <b class="${cls(ix.chg)}">${esc(ix.price)}</b> <span class="${cls(ix.chg)}">${sgn(ix.chg)}${ix.chg}%</span>`;
  const secs=d.sectors.map(s=>({...s,v:s.cap}));
  squarify(secs,0,0,W,H);
  let html='';
  for(const s of secs){
    const head=s.w>40&&s.h>34?15:0;
    html+=`<div class="sg" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px">${head?`<i>${esc(s.name)} ${sgn(s.chg)}${s.chg.toFixed(2)}%</i>`:''}</div>`;
    const st=s.stocks.map(x=>({...x,v:x.cap}));
    squarify(st,s.x+1,s.y+head+1,s.w-2,s.h-head-2);
    for(const t of st){
      const big=t.w>=30&&t.h>=26,huge=t.w>=90&&t.h>=56,small=t.w<46;
      html+=`<div class="tl ${mp.sel===t.c?'sel':''}" data-c="${t.c}" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:${mcolor(t.chg)}${huge?';font-size:15px':''}">`+
        (big?`<b style="font-size:${huge?15:small?10:12}px">${esc(t.n)}</b><span style="font-size:${small?9:11}px">${sgn(t.chg)}${t.chg.toFixed(small?1:2)}%</span>`:'')+`</div>`;
    }
  }
  el.innerHTML=html;
  document.getElementById('mleg').innerHTML=MSTEPS.map(([v,c])=>`<span style="background:${c}">${v>0?'+':''}${v}%</span>`).join('');
  mapSummary();
  if(mp.sel)showTile(mp.sel);
}
function mapSummary(){
  const cls=v=>v>0?'up':v<0?'dn':'',f=x=>x&&x.index?`${x.index.name} <b class="${cls(x.index.chg)}">${x.index.chg>0?'+':''}${x.index.chg}%</b>`:'';
  const t=[f(mp.data.KOSPI),f(mp.data.KOSDAQ)].filter(Boolean).join(' · ');if(t)document.getElementById('secMap').innerHTML=t;
}
function showTile(code){
  const d=mp.data[mp.m];if(!d)return;
  for(const s of d.sectors)for(const t of s.stocks)if(t.c===code){
    const c=t.chg>0?'up':t.chg<0?'dn':'';
    document.getElementById('minfo').innerHTML=`<a href="https://m.stock.naver.com/domestic/stock/${t.c}/total" target="_blank" rel="noopener">${esc(t.n)}</a> · ${esc(s.name)} · `+
      `<b>${t.p!=null?t.p.toLocaleString():''}원</b> <b class="${c}">${t.chg>0?'+':''}${t.chg.toFixed(2)}%</b> · 시총 ${fmtCap(t.cap)}`;
    return;}
}
document.getElementById('tmap').addEventListener('click',e=>{const t=e.target.closest('.tl');if(!t)return;mp.sel=t.dataset.c;
  document.querySelectorAll('.tl.sel').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');showTile(mp.sel);});
document.querySelectorAll('.mtab').forEach(b=>b.onclick=()=>{mp.m=b.dataset.m;mp.sel=null;try{localStorage.setItem('kr_map',mp.m);}catch(e){}
  if(mp.data[mp.m])renderMap();loadMap();});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(sec==='map')renderMap();},200);});
setInterval(()=>{if(sec!=='theme'&&sec!=='map')loadNews();},5*60e3);
document.getElementById('rbtn').onclick=()=>{load();if(sec==='map')loadMap();else if(sec!=='theme')loadNews();};
// ── 📑 리포트: 네이버 증권 리서치 (증권사 매크로·산업·기업 리포트, 10분 캐시) ──
const rp={data:null,at:0,sel:new Set()};
const REP_GROUPS=['K 테크','K 조방원','K 바이오','K 모빌리티','K 금융','소비·기타'];
function repItem(x,showSector){
  return `<div class="rp-i"><span class="rp-f">${esc(x.broker)}</span>${x.item?`<b>${esc(x.item)}</b> `:''}${showSector&&x.topic?`<span class="rp-s">${esc(x.topic)}</span>`:''}`+
    `<a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="rp-m">${esc(x.cat)} · ${esc(x.date.slice(5).replace('-','/'))} · 조회 ${x.views.toLocaleString()}</div></div>`;
}
function repBox(title,list,sub){
  return `<div class="rp-card"><div class="rp-h">${title} <span>${sub||''}</span></div>${list.length?list.map(x=>repItem(x)).join(''):'<div class="rp-m">리포트가 없어요</div>'}</div>`;
}
async function loadRep(){
  if(!rp.data||Date.now()-rp.at>300e3){
    try{const d=await (await fetch('api/reports',{cache:'no-store'})).json();if(!d.error){rp.data=d;rp.at=Date.now();}}catch(e){}
  }
  if(sec==='report')renderRep();else if(sec==='매크로')renderNews();
  if(rp.data)document.getElementById('secRep').innerHTML=`<b>${rp.data.macro.length+rp.data.industry.length+rp.data.company.length}</b>건 · 증권사 리포트`;
}
function renderRep(){
  const v=document.getElementById('repView'),d=rp.data;
  if(!d){v.innerHTML='<div class="rp-card">불러오는 중…</div>';return;}
  const IC=[...d.industry,...d.company];
  const keys=[['M','🏦 매크로·전략',d.macro.length],...REP_GROUPS.map(g=>['G:'+g,g,IC.filter(x=>x.group===g).length])];
  const on=k=>!rp.sel.size||rp.sel.has(k);
  let h=`<div class="rp-card"><div class="rp-h">📑 증권사 리포트 <span>네이버 증권 리서치 · 👆 여러 개 골라 보기 · 제목을 누르면 리포트(PDF)</span></div><div class="pills">`+
    `<button type="button" class="ni all ${rp.sel.size?'':'on'}" data-rp="ALL"><span>전체</span></button>`+
    keys.map(([k,n,c])=>`<button type="button" class="ni ${rp.sel.has(k)?'on':''} ${c?'':'empty'}" data-rp="${esc(k)}"><span>${esc(n)}</span><span class="c">${c}</span></button>`).join('')+'</div></div>';
  if(on('M'))h+=repBox('🏦 매크로·전략',d.macro.slice(0,40),'경제분석·투자전략·채권분석·데일리 시황');
  for(const g of REP_GROUPS){if(!on('G:'+g))continue;
    const L=IC.filter(x=>x.group===g).sort((a,b)=>b.date.localeCompare(a.date)||b.views-a.views);if(!L.length)continue;
    h+=`<div class="rp-card"><div class="rp-h">🏢 ${esc(g)} <span>산업분석 ${L.filter(x=>x.cat==='산업분석').length} · 종목분석 ${L.filter(x=>x.cat==='종목분석').length}</span></div>`;
    for(const t of [...new Set(L.map(x=>x.topic))])h+=`<div class="rp-g">${esc(t)}</div>`+L.filter(x=>x.topic===t).slice(0,15).map(x=>repItem(x)).join('');
    h+='</div>';}
  v.innerHTML=h;
}
document.getElementById('repView').addEventListener('click',e=>{const b=e.target.closest('[data-rp]');if(!b)return;const k=b.dataset.rp;
  if(k==='ALL')rp.sel.clear();else rp.sel.has(k)?rp.sel.delete(k):rp.sel.add(k);renderRep();});
setInterval(()=>{if(sec==='report'||sec==='매크로')loadRep();},300e3);

setSec(sec);if(sec!=='report')loadRep();
if(sec!=='map')['KOSPI','KOSDAQ'].forEach(m=>fetch('api/map?m='+m).then(r=>r.json()).then(x=>{if(!x.error){mp.data[m]=x;mapSummary();}}).catch(()=>{}));
loadNews();
load();
// 📊 주요 지표: 환율·달러지수·비트코인·금·금리 (api/macro, 30초마다)
async function loadMacro(){
  try{
    const d=await (await fetch('api/macro',{cache:'no-store'})).json();if(!d.items)return;
    const f=(v,n)=>v==null?'–':Number(v).toLocaleString('en-US',{minimumFractionDigits:n,maximumFractionDigits:n});
    document.getElementById('mxG').innerHTML=d.items.map(x=>{const c=x.chg==null?'f':x.chg>0?'u':x.chg<0?'d':'f',s=x.chg>0?'+':'';
      return `<div class="mx-t" title="${x.sym}"><div class="mx-n">${x.name}</div><div class="mx-p">${f(x.price,x.d)}${x.unit&&x.price!=null?'<small style="font-size:10px">%</small>':''}</div>`+
        // 등락: 금리는 bp(0.01%p) 변화, 나머지는 % (자세한 값은 길게 누르면/마우스를 올리면)
        `<div class="mx-c ${c}" title="${x.chg==null?'':s+f(x.chg,x.d)} (${x.pct==null?'':s+f(x.pct,2)}%)">${x.unit?(x.chg==null?'':s+f(x.chg*100,1)+'bp'):(x.pct==null?'':s+f(x.pct,2)+'%')}</div></div>`;}).join('');
    document.getElementById('mxAt').textContent=new Date(d.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 기준 · 30초마다';
    document.getElementById('mx').hidden=false;
  }catch(e){}
}
loadMacro();setInterval(loadMacro,30e3);
