<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 블벅터 KR · 한국 증시</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#e5e7eb;--sub:#6b7280;--ink:#111827;--acc:#2563eb;--up:#dc2626;--dn:#2563eb;--r:14px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
a{color:inherit}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:.5px solid var(--bd)}
.brand{font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.02em}.brand em{font-style:normal;color:var(--up)}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 11px;background:#f3f4f6;color:#4b5563}
.pill.open{background:#fee2e2;color:#b91c1c}
.spacer{flex:1}
.hsub{font-size:12px;color:var(--sub)}
.btn{padding:8px 14px;border-radius:10px;border:.5px solid var(--bd);background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:#374151;text-decoration:none;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:640px){.secs{grid-template-columns:1fr 1fr}}
.why{margin-top:6px;font-size:13px;line-height:1.45;background:#fffbeb;border:.5px solid #fde68a;border-radius:8px;padding:5px 8px;overflow-wrap:anywhere}
.why a{text-decoration:none;font-weight:600}.why a:hover{color:var(--acc)}
.why .src{font-size:11.5px;color:var(--sub)}
.why.alt{background:#f9fafb;border-color:var(--bd)}
.sec{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.sec.on{border-color:#111827;box-shadow:0 0 0 2px #111827 inset}
.sec .t{font-weight:800;font-size:16px}.sec .s{font-size:13px;color:var(--sub);margin-top:2px}
.sec .s b{font-family:var(--mono);font-size:16px}
.ncats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.nc{padding:6px 12px;border-radius:999px;border:.5px solid var(--bd);background:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.nc.on{background:#111827;color:#fff;border-color:#111827}.nc small{font-family:var(--mono);opacity:.7;margin-left:3px}
.nw{background:var(--card);border:.5px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;min-width:0}
.nr1{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.tb{font-family:var(--mono);font-size:12px;font-weight:700;background:#111827;color:#fff;border-radius:6px;padding:1px 7px}
.vb{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px}
.v-VERIFIED{background:#dcfce7;color:#166534}.v-SINGLE{background:#fef3c7;color:#92400e}.v-UNVERIFIED{background:#f3f4f6;color:#4b5563}
.tg{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:#eef2ff;color:#3730a3}
.nh{font-weight:600;font-size:15px;text-decoration:none;line-height:1.45;overflow-wrap:anywhere}.nh:hover{color:var(--acc)}
.nw details{font-size:12.5px;color:var(--sub);margin-top:4px}.nw summary{cursor:pointer}
.nw details div{padding:2px 0;overflow-wrap:anywhere}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sm{flex:1 1 140px;background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:8px 12px;box-shadow:var(--sh);min-width:0}
.sm b{font-family:var(--mono);font-size:17px;display:block}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap;align-items:center}
.tab{padding:8px 15px;border-radius:999px;border:.5px solid var(--bd);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:#111827;color:#fff;border-color:#111827}
#q{flex:1 1 140px;min-width:0;padding:7px 12px;border-radius:999px;border:.5px solid var(--bd);font:inherit;font-size:13px}
.th{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px;min-width:0}
.th-h{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:10px 12px;cursor:pointer}
.rk{font-family:var(--mono);font-weight:700;color:var(--sub);text-align:center;font-size:13px}
.nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.chg{font-family:var(--mono);font-weight:700;font-size:19px;text-align:right;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;color:var(--sub)}
.breadth{display:inline-flex;width:70px;height:6px;border-radius:3px;overflow:hidden;background:#dbeafe;vertical-align:middle}
.breadth i{display:block;height:100%;background:#f87171}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12.5px;border-radius:6px;padding:1px 7px;background:#f9fafb;border:.5px solid var(--bd);white-space:nowrap}
.chip b{font-family:var(--mono)}
.new{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;background:#fef3c7;color:#92400e}
.mv{font-family:var(--mono);font-size:10px;font-weight:700}
.det{border-top:.5px dashed var(--bd);padding:10px 12px 12px}
.desc{font-size:13.5px;color:#374151;margin:0 0 8px;line-height:1.55}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{padding:6px 6px;border-bottom:.5px solid var(--bd);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:600}
td:first-child,th:first-child{text-align:left;white-space:normal}
tr.st{cursor:pointer}tr.st:hover td{background:#f9fafb}
.sn{font-weight:600}.mk{font-size:10px;color:var(--sub);margin-left:4px}
.info{font-size:13px;color:#374151;background:#f9fafb;white-space:normal!important;text-align:left!important;line-height:1.5}
.news{list-style:none;margin:6px 0 0;padding:0}
.news li{padding:5px 0;border-top:.5px dashed var(--bd);font-size:13.5px;overflow-wrap:anywhere}
.news a{text-decoration:none}.news a:hover{color:var(--acc)}
.tm{font-family:var(--mono);font-size:10px;color:var(--sub);margin-right:5px}
.empty{color:var(--sub);font-size:13px;padding:14px 4px}
footer{font-size:11px;color:var(--sub);text-align:center;padding:16px 0}
</style>
</head>
<body>
<div id="bar">
  <a class="brand" href="./">미니 블벅터 <em>KR</em> <span style="font-size:14px;font-weight:700;color:#6b7280">한국 증시용</span></a>
  <span class="pill" id="mst">—</span>
  <span class="hsub" id="upd"></span>
  <div class="spacer"></div>
  <button class="btn" id="rbtn">↻ 새로고침</button>
  <a class="btn" href="https://mini-bbterminal.pages.dev">🇺🇸 미국 증시</a>
</div>
<div class="wrap">
  <div class="secs" id="secs">
    <button class="sec" data-sec="theme"><div class="t">📈 테마</div><div class="s" id="secTheme">불러오는 중…</div></button>
    <button class="sec" data-sec="산업"><div class="t">🏭 산업</div><div class="s" data-cnt="산업">뉴스</div></button>
    <button class="sec" data-sec="매크로"><div class="t">🌐 매크로</div><div class="s" data-cnt="매크로">뉴스</div></button>
    <button class="sec" data-sec="정치·정책"><div class="t">🏛️ 정치·정책</div><div class="s" data-cnt="정치·정책">뉴스</div></button>
  </div>
  <div id="newsView" hidden><div class="ncats" id="ncats"></div><div id="nlist"><div class="empty">불러오는 중…</div></div></div>
  <div id="themeView">
  <div class="summary" id="sum"></div>
  <div class="tabs">
    <span class="tab on" data-v="up">🔥 강한 테마</span>
    <span class="tab" data-v="dn">🧊 약한 테마</span>
    <span class="tab" data-v="all">전체</span>
    <input id="q" placeholder="테마 검색 (예: 반도체, 원전)">
  </div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  </div>
  <footer>테마: 네이버 증권 테마 분류·시세 (최대 1분 지연, 장중 30초마다 갱신) · 뉴스: 구글 뉴스 한국판 직전 24시간, 15분마다 수집 · 투자 권유 아님</footer>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'–':`${v>0?'+':''}${v.toFixed(2)}%`;
const cls=v=>v>0?'up':v<0?'dn':'';
const eok=v=>v==null?'–':v>=100?`${Math.round(v/100).toLocaleString()}억`:`${v}백만`;
const st={view:'up',q:'',open:new Set(),data:null};
let timer=null,nextAt=0;

// 순위 변화: 이 화면을 연 뒤 받은 순위를 기억했다가 약 5분 전과 비교
function rankHistory(groups){
  let h=[];try{h=JSON.parse(sessionStorage.getItem('kr_rank')||'[]');}catch(e){}
  const now=Date.now(),order=groups.map(g=>g.no);
  h.push({t:now,o:order});h=h.filter(x=>now-x.t<20*60e3).slice(-60);
  try{sessionStorage.setItem('kr_rank',JSON.stringify(h));}catch(e){}
  const base=h.find(x=>now-x.t>=4*60e3&&now-x.t<=10*60e3)||h[0];
  const prev=new Map(base.o.map((n,i)=>[n,i]));
  return {move:no=>{const p=prev.get(no);return p==null?null:p-order.indexOf(no);},mins:Math.round((now-base.t)/60e3)};
}

async function load(){
  try{
    const r=await fetch('api/themes',{cache:'no-store'});const d=await r.json();
    if(d.error)throw new Error(d.error);
    st.data=d;st.rh=rankHistory(d.groups);render();
  }catch(e){document.getElementById('list').innerHTML=`<div class="empty">데이터를 불러오지 못했어요 (${esc(e.message)}). 잠시 뒤 다시 시도해요.</div>`;}
  schedule();
}
function schedule(){
  clearTimeout(timer);const open=st.data&&st.data.status==='OPEN';
  const ms=open?30e3:300e3;nextAt=Date.now()+ms;timer=setTimeout(load,ms);
}
setInterval(()=>{const s=Math.max(0,Math.round((nextAt-Date.now())/1e3));const at=st.data?new Date(st.data.at):null;
  document.getElementById('upd').textContent=at?`${at.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} 기준 · ${s}초 뒤 갱신`:'';},1000);

function render(){
  const d=st.data;if(!d)return;
  const open=d.status==='OPEN',ms=document.getElementById('mst');
  ms.textContent=open?'● 장중':'장 마감';ms.className='pill'+(open?' open':'');
  const G=d.groups,up=G.filter(g=>g.chg>0).length,dn=G.filter(g=>g.chg<0).length;
  const top=G[0],bot=G[G.length-1];
  document.getElementById('secTheme').innerHTML=`오른 <b class="up">${up}</b> / 내린 <b class="dn">${dn}</b>`;
  document.getElementById('sum').innerHTML=
    `<div class="sm"><span class="hsub">가장 강한 테마</span><b class="up" style="font-size:14px">${esc(top.name)} ${pct(top.chg)}</b></div>
     <div class="sm"><span class="hsub">가장 약한 테마</span><b class="dn" style="font-size:14px">${esc(bot.name)} ${pct(bot.chg)}</b></div>`;
  let list=st.view==='dn'?[...G].reverse():G;
  if(st.q)list=list.filter(g=>g.name.toLowerCase().includes(st.q.toLowerCase()));
  else if(st.view!=='all')list=list.slice(0,30);
  const rankOf=new Map(G.map((g,i)=>[g.no,i+1]));
  document.getElementById('list').innerHTML=list.length?list.map(g=>card(g,rankOf.get(g.no))).join(''):'<div class="empty">해당하는 테마가 없어요.</div>';
  for(const no of st.open)openDetail(no,false);
  loadReasons(list.slice(0,30));
}

// ── 강세(약세) 이유: 테마마다 /api/why (대장주 뉴스 → 구글 뉴스 → 관련 뉴스 → 테마 개요 순으로 찾음) ──
const why=new Map();   // no → {at, d}
async function loadReasons(list){
  list.forEach(paintWhy);
  const todo=list.filter(g=>{const w=why.get(g.no);return !w||Date.now()-w.at>300e3;});
  let i=0;
  const worker=async()=>{while(i<todo.length){const g=todo[i++];
    try{const d=await (await fetch(`api/why/${g.no}`)).json();if(!d.error){why.set(g.no,{at:Date.now(),d});paintWhy(g);}}catch(e){}}};
  await Promise.all(Array.from({length:6},worker));
}
function paintWhy(g){
  const el=document.querySelector(`[data-why="${g.no}"]`),w=why.get(g.no);if(!el||!w)return;
  const d=w.d,tm=d.ts?new Date(d.ts).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'';
  const up=g.chg>=0;
  if(d.kind==='reason')el.innerHTML=`💡 <b>${up?'강세':'약세'} 이유</b> <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> <span class="src">· ${d.stock?esc(d.stock)+' 관련 · ':''}${esc(d.office||'')} ${tm}</span>`;
  else if(d.kind==='related')el.innerHTML=`📰 <b>관련 뉴스</b> <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> <span class="src">· ${esc(d.stock||'')} · ${esc(d.office||'')} ${tm}</span>`;
  else el.innerHTML=`📌 <b>테마 개요</b> ${esc(d.desc||'')}${d.info?`<br><span class="src">${esc(d.stock)}: ${esc(d.info)}…</span>`:''}`;
  el.classList.toggle('alt',d.kind!=='reason');el.hidden=!(d.title||d.desc||d.info);
}
function card(g,rank){
  const mv=st.rh?st.rh.move(g.no):null;
  const mvs=mv?`<span class="mv ${mv>0?'up':'dn'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</span>`:'';
  const hot=mv!=null&&mv>=8&&rank<=20?'<span class="new">🚀 급부상</span>':'';
  const ratio=g.total?Math.round(g.rise/g.total*100):0;
  const chips=(g.leaders||[]).map(s=>`<span class="chip">${esc(s.name)} <b class="${cls(s.chg)}">${pct(s.chg)}</b></span>`).join('');
  return `<div class="th" id="t${g.no}"><div class="th-h" data-no="${g.no}">
    <span class="rk">${rank}</span>
    <div style="min-width:0"><div class="nm">${esc(g.name)} ${hot}</div>
      <div class="meta"><span class="breadth" title="오른 종목 비율"><i style="width:${ratio}%"></i></span><span>▲${g.rise} ▼${g.fall} / ${g.total}종목</span>
      ${g.value?`<span>거래대금 ${eok(g.value)}</span>`:''}${mvs?`<span>${st.rh.mins}분 전 대비 ${mvs}</span>`:''}</div>
      ${chips?`<div class="chips">${chips}</div>`:''}<div class="why" data-why="${g.no}" hidden></div></div>
    <span class="chg ${cls(g.chg)}">${pct(g.chg)}</span></div><div class="det" hidden></div></div>`;
}
async function openDetail(no,toggle=true){
  const box=document.querySelector(`#t${no} .det`);if(!box)return;
  if(toggle&&!box.hidden){box.hidden=true;st.open.delete(no);return;}
  st.open.add(no);box.hidden=false;if(!box.innerHTML)box.innerHTML='<div class="empty">구성 종목 불러오는 중…</div>';
  try{
    const d=await (await fetch(`api/theme/${no}`)).json();if(d.error)throw new Error(d.error);
    box.innerHTML=`${d.desc?`<p class="desc">${esc(d.desc)}</p>`:''}
      <table><tr><th>종목 (누르면 편입 사유·뉴스)</th><th>현재가</th><th>등락률</th><th>거래대금</th></tr>
      ${d.stocks.map(s=>`<tr class="st" data-code="${s.code}"><td><span class="sn">${esc(s.name)}</span><span class="mk">${s.market}</span></td>
        <td class="mono">${s.price==null?'–':s.price.toLocaleString()}</td><td class="mono ${cls(s.chg)}">${pct(s.chg)}</td><td class="mono">${eok(s.value)}</td></tr>
        <tr hidden data-info="${s.code}"><td colspan="4" class="info">${s.info?esc(s.info):'편입 사유 정보 없음'}<ul class="news"><li class="hsub">뉴스 불러오는 중…</li></ul></td></tr>`).join('')}</table>`;
  }catch(e){box.innerHTML=`<div class="empty">불러오지 못했어요 (${esc(e.message)})</div>`;}
}
async function toggleStock(code,box){
  const row=box.querySelector(`tr[data-info="${code}"]`);row.hidden=!row.hidden;if(row.hidden||row.dataset.loaded)return;
  row.dataset.loaded=1;const ul=row.querySelector('.news');
  try{
    const n=await (await fetch(`api/news/${code}`)).json();
    ul.innerHTML=n.length?n.map(x=>`<li><span class="tm">${x.t?`${x.t.slice(4,6)}/${x.t.slice(6,8)} ${x.t.slice(8,10)}:${x.t.slice(10,12)}`:''}</span><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="hsub">· ${esc(x.office)}</span></li>`).join(''):'<li class="hsub">최근 뉴스 없음</li>';
  }catch(e){ul.innerHTML='<li class="hsub">뉴스를 불러오지 못했어요</li>';}
}
document.getElementById('list').addEventListener('click',e=>{
  const h=e.target.closest('.th-h');if(h){openDetail(+h.dataset.no);return;}
  const tr=e.target.closest('tr.st');if(tr)toggleStock(tr.dataset.code,tr.closest('.det'));
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{st.view=t.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));render();});
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim();render();};
// ── 섹션: 장중 테마 / 한국 증시 뉴스 ──
const VL={VERIFIED:'검증됨',SINGLE:'단독보도',UNVERIFIED:'미확인'};
const ns={cat:'ALL',data:null,at:0};
let sec='theme';try{sec=localStorage.getItem('kr_sec')||'theme';}catch(e){}
if(!['theme','산업','매크로','정치·정책'].includes(sec))sec='theme';
function setSec(v){
  sec=v;try{localStorage.setItem('kr_sec',v);}catch(e){}
  document.querySelectorAll('.sec').forEach(b=>b.classList.toggle('on',b.dataset.sec===v));
  document.getElementById('themeView').hidden=v!=='theme';document.getElementById('newsView').hidden=v==='theme';
  ns.cat='ALL';
  if(v!=='theme'){if(Date.now()-ns.at>60e3)loadNews();else renderNews();}
}
async function loadNews(){
  try{const d=await (await fetch('api/krnews',{cache:'no-store'})).json();if(d.error)throw new Error(d.error);ns.data=d;ns.at=Date.now();renderNews();}
  catch(e){document.getElementById('nlist').innerHTML=`<div class="empty">뉴스를 불러오지 못했어요 (${esc(e.message)})</div>`;}
}
function renderNews(){
  const d=ns.data;if(!d)return;
  const at=new Date(d.generated_at);
  const hm=at.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('[data-cnt]').forEach(el=>{const n=d.topics.filter(t=>t.section===el.dataset.cnt).reduce((a,t)=>a+t.count,0);
    el.innerHTML=`<b>${n}</b>건 · ${hm}`;});
  if(sec==='theme')return;
  const T=d.topics.filter(t=>t.section===sec),tot=T.reduce((a,t)=>a+t.count,0);
  document.getElementById('ncats').innerHTML=[`<span class="nc ${ns.cat==='ALL'?'on':''}" data-c="ALL">전체<small>${tot}</small></span>`,
    ...T.map(t=>`<span class="nc ${ns.cat===t.id?'on':''}" data-c="${t.id}">${esc(t.name)}<small>${t.count}</small></span>`)].join('');
  const seen=new Set(),items=[];
  for(const t of T){if(ns.cat!=='ALL'&&ns.cat!==t.id)continue;
    for(const x of t.stories){if(x.is_opinion||seen.has(x.headline))continue;seen.add(x.headline);items.push([x,t.name]);}}
  items.sort((a,b)=>b[0].first_seen-a[0].first_seen);
  document.getElementById('nlist').innerHTML=items.length?items.map(([x,cat])=>{
    const tm=x.first_seen_kst.replace('-','/');
    return `<div class="nw"><div class="nr1"><span class="tb">${esc(tm)}</span><span class="vb v-${x.verdict}">${VL[x.verdict]}</span><span class="tg">${esc(cat)}</span><span class="hsub">출처 ${x.n_sources}</span></div>
      <a class="nh" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.headline)}</a>
      ${x.sources.length>1?`<details><summary>보도 ${x.sources.length}건 보기</summary>${x.sources.map(s=>`<div><span class="tm">${esc(s.time_kst.slice(6))}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.headline)}</a> · ${esc(s.name)}</div>`).join('')}</details>`:`<div class="hsub" style="margin-top:3px">${esc(x.sources[0].name)}</div>`}</div>`;}).join('')
    :'<div class="empty">해당 카테고리 뉴스가 없어요.</div>';
}
document.getElementById('ncats').addEventListener('click',e=>{const c=e.target.closest('.nc');if(c){ns.cat=c.dataset.c;renderNews();}});
document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>setSec(b.dataset.sec));
setInterval(()=>{if(sec!=='theme')loadNews();},5*60e3);
document.getElementById('rbtn').onclick=()=>{load();if(sec!=='theme')loadNews();};
setSec(sec);
loadNews();
load();
</script>
</body>
</html>
